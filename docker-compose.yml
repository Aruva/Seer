services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: southseer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d southseer"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── One-shot migration runner ────────────────────────────────────────────────
  # Runs "alembic upgrade head" before the bot starts.
  # Safe to re-run — alembic is idempotent if already at head.
  migrate:
    build: .
    command: >
      python3 /upgrade.py
      postgresql://postgres:postgres@db:5432/southseer
      head
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    restart: on-failure

  # ── SouthSeer bot ────────────────────────────────────────────────────────────
  bot:
    build: .
    command: seer
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # Override DATABASE_URL so the bot connects to the compose db service.
      # (The value in .env is only used if you run the bot outside of Docker.)
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/southseer"
      DD_TRACE_ENABLED: "false"
      # Set to "1" to skip command sync on startup (avoids Discord rate limits).
      # Commands stay registered from the last successful sync.
      # Remove or set to "" when you need to re-sync (e.g. after adding new commands).
      # SKIP_COMMAND_SYNC: "1"

  # ── SouthSeer Web API ───────────────────────────────────────────────────────
  # Serves the REST API used by Arbiter for player search + infractions.
  api:
    build: .
    command: /start-seerapi.sh
    restart: unless-stopped
    ports:
      - "3008:3008"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/southseer"
      DD_TRACE_ENABLED: "false"
      HOST: "0.0.0.0"
      PORT: "3008"

volumes:
  db_data: